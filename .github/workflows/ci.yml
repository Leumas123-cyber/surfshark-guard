name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (arm64 + universal)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version && uname -m
      - name: Build apps
        run: |
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh
      - name: Confirm separate arm64 and universal binaries
        run: |
          ARM=build/SurfsharkGuard-arm64.app/Contents/MacOS/SurfsharkGuard
          UNI=build/SurfsharkGuard.app/Contents/MacOS/SurfsharkGuard
          file "$ARM" "$UNI"
          ARM_ARCHS="$(lipo -archs "$ARM")"
          UNI_ARCHS="$(lipo -archs "$UNI")"
          echo "arm64 app: $ARM_ARCHS"
          echo "universal app: $UNI_ARCHS"
          echo "$ARM_ARCHS" | grep -q arm64
          echo "$ARM_ARCHS" | grep -q x86_64 && exit 1 || true
          echo "$UNI_ARCHS" | grep -q arm64
          echo "$UNI_ARCHS" | grep -q x86_64
          ls -lh build/SurfsharkGuard-*-arm64.dmg build/SurfsharkGuard-*-universal.dmg
      - name: Keep DMGs as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmgs
          retention-days: 7
          path: |
            build/SurfsharkGuard-*-arm64.dmg
            build/SurfsharkGuard-*-universal.dmg
